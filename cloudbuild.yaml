steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://sicakra-api-qgjaoib32q-et.a.run.app'
      - '-t'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/sicakra/sicakra-landing-page:$SHORT_SHA'
      - '-t'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/sicakra/sicakra-landing-page:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/sicakra/sicakra-landing-page'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sicakra-landing-page'
      - '--image=asia-southeast2-docker.pkg.dev/$PROJECT_ID/sicakra/sicakra-landing-page:$SHORT_SHA'
      - '--region=asia-southeast2'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3002'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'

images:
  - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/sicakra/sicakra-landing-page'

options:
  logging: CLOUD_LOGGING_ONLY
